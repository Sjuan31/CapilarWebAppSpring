<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Producto | CapilarDía</title>

    

</head>

<body>

<div class="contenedor">

    <h1 th:text="${producto.idProducto == 0 ? 'Nuevo producto' : 'Editar producto'}">
        Producto
    </h1>

    <form th:action="@{/productos/guardar}"
          th:object="${producto}"
          method="post">

        <input type="hidden"
               th:field="*{idProducto}">

        <label>Nombre</label>
        <input type="text"
               th:field="*{nombre}"
               required>

        <label>Precio</label>
        <input type="number"
               step="0.01"
               th:field="*{precio}"
               required>

        <label>Stock</label>
        <input type="number"
               th:field="*{stock}"
               required>

        <label>Imagen</label>
        <input type="text"
               th:field="*{imagen}">

        <label>ID Categoría</label>
        <input type="number"
               th:field="*{idCategoria}"
               required>

        <label>ID Fabricante</label>
        <input type="number"
               th:field="*{idFabricante}"
               required>

        <div class="botones">

            <button type="submit">
                Guardar
            </button>

            <a href="/productos"
               class="volver">
                Cancelar
            </a>

        </div>

    </form>

</div>

</body>

</html>
