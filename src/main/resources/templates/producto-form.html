<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Producto | CapilarDía</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f1e8;
            color: #2f2f2f;
        }

        .contenedor {
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
            background: #fffaf3;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            color: #2f2f2f;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d8cbb9;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .botones {
            margin-top: 25px;
        }

        button,
        .volver {
            display: inline-block;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            background: #b89a67;
            color: white;
        }

        .volver {
            background: #ddd2c3;
            color: #2f2f2f;
            margin-left: 10px;
        }
    </style>

</head>

<body>

<div class="contenedor">

    <h1 th:text="${producto.idProducto == 0 ? 'Nuevo producto' : 'Editar producto'}">
        Producto
    </h1>

    <form th:action="@{/productos/guardar}"
          th:object="${producto}"
          method="post">

        <input type="hidden"
               th:field="*{idProducto}">

        <label>Nombre</label>
        <input type="text"
               th:field="*{nombre}"
               required>

        <label>Precio</label>
        <input type="number"
               step="0.01"
               th:field="*{precio}"
               required>

        <label>Stock</label>
        <input type="number"
               th:field="*{stock}"
               required>

        <label>Imagen</label>
        <input type="text"
               th:field="*{imagen}">

        <label>ID Categoría</label>
        <input type="number"
               th:field="*{idCategoria}"
               required>

        <label>ID Fabricante</label>
        <input type="number"
               th:field="*{idFabricante}"
               required>

        <div class="botones">

            <button type="submit">
                Guardar
            </button>

            <a href="/productos"
               class="volver">
                Cancelar
            </a>

        </div>

    </form>

</div>

</body>

</html>
